/* Madder, light. Same tokens as the site. */
:root{
  --paper:#F4F5EC; --band:#C3CCAE; --ink:#1D2816; --ink3:#4B5740;
  --accent:#862721; --rule:rgba(29,40,22,.14);
  --peri-bulb:var(--accent);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{display:flex;background:var(--paper);
  font-family:'Spline Sans Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}

.band{width:300px;flex:0 0 300px;background:var(--band);
  display:flex;flex-direction:column;justify-content:flex-end;padding:56px 48px}
.band .peri{color:var(--ink3)}
.band svg{display:block}

.main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  padding:0 80px}
h1{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:136px;
  line-height:.9;letter-spacing:-.03em;color:var(--ink)}
h1 .dot{color:var(--accent)}
.tag{font-size:24px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);margin-top:28px}
.rule{height:1px;background:var(--rule);margin:44px 0 0}
.meta{font-size:20px;letter-spacing:.01em;color:var(--ink3);margin-top:28px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.meta b{color:var(--ink);font-weight:400}
</style>
